name: Student platform
on:
  pull_request:
    paths: ['student-platform/**', 'integration-contracts/**', '.github/workflows/student-platform.yml']
  push:
    paths: ['student-platform/**', 'integration-contracts/**', '.github/workflows/student-platform.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test student-platform/test/*.test.js
